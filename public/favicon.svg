<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Subtle cyan bevel light gradient on top border -->
    <linearGradient id="gkBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>

    <!-- Subtle radial glow behind the monogram -->
    <radialGradient id="gkCoreGlow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark charcoal / black rounded badge -->
  <rect width="128" height="128" rx="28" fill="#0A0B0E" />
  
  <!-- Subtle core ambient glow -->
  <rect width="128" height="128" rx="28" fill="url(#gkCoreGlow)" />

  <!-- Micro-border bezel -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#gkBorderGlow)" stroke-width="2.5" />

  <!-- Monogram: 'G' in crisp white -->
  <path
    d="M 56 28 L 35 28 C 27 28 24 33 24 41 L 24 87 C 24 95 27 100 35 100 L 51 100 C 56 100 58 97 58 91 L 58 64 L 43 64"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Monogram: 'K' vertical spine in crisp white -->
  <path
    d="M 72 28 L 72 100"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
  />

  <!-- Monogram: 'K' chevron arms in electric cyan -->
  <path
    d="M 104 30 L 76 64 L 104 98"
    fill="none"
    stroke="#00E5FF"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
